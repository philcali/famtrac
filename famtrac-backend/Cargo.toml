[package]
name = "famtrac-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
aws_lambda_events = "0.15"
lambda_runtime = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
aws-sdk-dynamodb = "1.0"
aws-config = "1.0"
tokio = { version = "1.0", features = ["rt", "macros"] }
async-trait = "0.1"
base64 = "0.22"

[dev-dependencies]
proptest = "1.4"
tokio-test = "0.4"
aws-config = "1.0"
