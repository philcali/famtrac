name: Infrastructure CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'famtrac-infra/**'
      - '.github/workflows/infra-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: famtrac-infra
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: famtrac-infra/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build (TypeScript check)
        run: npm run build
      
      - name: Run tests
        run: npm test
